<style>
:root{--lime:#baff29;--ink:#12132f;--bg:#0d0e24;--s1:#171a3d;--s2:#222659;--line:#2f3468;--tx:#f2f4fc;--mut:#9ca4ca;--acc:#baff29;--blue:#3b8bff;--vis:100px}
[data-theme=light]{--bg:#ffffff;--s1:#f0f3fb;--s2:#e2e7f6;--line:#d3daee;--tx:#1a1b41;--mut:#5b6288;--acc:#2f6b00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}html.big{font-size:19px}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Bengali","Hind Siliguri",Roboto,sans-serif;line-height:1.45}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit}
svg.i{width:1.5rem;height:1.5rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
svg.f{fill:currentColor}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- map ---------- */
#map{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;background:var(--bg)}
.leaflet-container{font:inherit;background:var(--bg)}
.leaflet-control-attribution{background:var(--bg)!important;opacity:.85;color:var(--mut)!important;font-size:10px!important;padding:1px 6px!important;border-radius:6px}
.leaflet-control-attribution a{color:var(--mut)!important}
.leaflet-bottom.leaflet-left{bottom:var(--vis);margin:0 0 4px 4px}
.leaflet-bar a{background:var(--s1)!important;color:var(--tx)!important;border-color:var(--line)!important;width:38px!important;height:38px!important;line-height:38px!important;font-size:20px!important}

/* ---------- top: search + chips ---------- */
#top{position:fixed;z-index:1000;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;padding-top:46px;pointer-events:none}
#top>*{pointer-events:auto}
#sbox{display:flex;align-items:center;gap:8px;height:54px;padding:0 5px 0 10px;border-radius:27px;background:var(--s1);border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.35)}
.mk{width:36px;height:36px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;flex:0 0 auto}
.mk svg{width:21px;height:21px;stroke-width:2.6}
#q{flex:1;min-width:0;height:100%;border:0;background:none;color:var(--tx);font:inherit;font-size:1rem;outline:0;-webkit-appearance:none;appearance:none}
#q::placeholder{color:var(--mut);opacity:1}
#sbox{background:var(--s1);border-color:transparent;box-shadow:0 2px 8px rgba(0,0,0,.18);padding-left:16px}
#sbox:focus-within{border-color:var(--acc);box-shadow:0 2px 10px rgba(0,0,0,.16)}
.mk{width:30px;height:30px;background:transparent;color:var(--acc)}
.mk svg{width:22px;height:22px}
#q{font-size:1rem;font-weight:500}
#chips{gap:8px;padding:10px 2px 4px;mask-image:linear-gradient(to right,#000 0%,#000 94%,transparent 100%)}
#q::-webkit-search-cancel-button{display:none}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;color:var(--tx)}
.ib:active{background:var(--s2)}
#chips{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 6px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:38px;padding:0 16px;border-radius:10px;background:var(--s1);border:1px solid color-mix(in srgb,var(--line) 65%,transparent);font-weight:600;font-size:.88rem;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.10);transition:background .12s,border-color .12s}
.chip:active{transform:scale(.98)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:750;box-shadow:none}
[data-theme=dark] .chip.on{color:#10120b}
[data-theme=dark] .leaflet-tile-pane img{filter:invert(92%) hue-rotate(180deg) brightness(82%) contrast(88%)}

/* ---------- quick settings, separate from search ---------- */
#quick{position:fixed;z-index:1200;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;display:flex;gap:6px;pointer-events:auto}
.qbtn{height:40px;min-width:40px;padding:0 10px;border-radius:12px;background:var(--s1);border:1px solid var(--line);color:var(--tx);font-size:.78rem;font-weight:750}
.qbtn:active{background:var(--s2)}
/* ---------- settings menu ---------- */
#menu{position:fixed;z-index:1300;top:calc(env(safe-area-inset-top,0px) + 72px);right:10px;width:min(310px,calc(100vw - 20px));max-height:calc(100% - 90px);overflow-y:auto;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
#menu img{height:28px;display:block;margin:0 0 12px}
.mrow{margin-bottom:12px}
.mrow>span{display:block;font-size:.8rem;color:var(--mut);margin-bottom:5px;font-weight:600}
.seg2{display:flex;background:var(--bg);border-radius:13px;padding:3px}
.seg2 button{flex:1;height:40px;border-radius:10px;font-weight:600;font-size:.9rem;display:flex;align-items:center;justify-content:center;gap:6px}
.seg2 button.on{background:var(--lime);color:var(--ink);font-weight:800}
.seg2 svg{width:1.1rem;height:1.1rem}
#bHelp{width:100%;height:46px;border-radius:14px;border:1.5px solid var(--lime);color:var(--acc);font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}

/* ---------- bottom sheet / side panel ---------- */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:1100;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;box-shadow:0 -3px 12px rgba(0,0,0,.18);padding-bottom:env(safe-area-inset-bottom,0px);transform:translate3d(0,100%,0);transition:transform .26s cubic-bezier(.2,.8,.2,1);will-change:transform;max-height:100%}
#sheet.drag{transition:none}
#dz{flex:0 0 auto;touch-action:none}
.grab{display:block;width:100%;height:26px;position:relative}
.grab::after{content:"";position:absolute;left:50%;top:10px;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:var(--line)}
.brand{display:none;padding:16px 16px 4px}
.brand img{height:30px}
#stop{display:flex;align-items:center;gap:10px;padding:0 14px 12px;min-height:50px}
#title{flex:1;min-width:0;font-weight:800;font-size:1.02rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#cta{flex:0 0 auto;height:44px;padding:0 16px;border-radius:22px;background:var(--lime);color:var(--ink);font-weight:800;display:flex;align-items:center;gap:6px}
#cta svg{width:1.2rem;height:1.2rem}
#fab{position:absolute;right:12px;bottom:100%;margin-bottom:12px;width:54px;height:54px;border-radius:50%;background:var(--s1);color:var(--acc);border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.45);display:grid;place-items:center}
#fab.on{background:var(--lime);color:var(--ink);border-color:var(--lime)}
#fab.busy svg{animation:spin 1s linear infinite}
#sheet[data-s=full] #fab{opacity:0;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 12px 14px}
#rad{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
#rad::-webkit-scrollbar{display:none}
.seg{flex:0 0 auto;height:36px;padding:0 14px;border-radius:18px;background:var(--s1);border:1px solid var(--line);font-weight:600;font-size:.85rem}
.seg.on{background:var(--s2);border-color:var(--lime);color:var(--acc);font-weight:800}
.card{display:flex;align-items:center;gap:12px;padding:9px;border-radius:12px;background:var(--s1);margin-bottom:6px;cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 64px;border:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.card:active{background:var(--s2)}
.ci{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.45rem;font-style:normal;flex:0 0 auto;background:var(--s2);box-shadow:inset 0 0 0 1px var(--c)}
.info{flex:1;min-width:0}
.info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.98rem}

.gob{flex:0 0 auto;min-width:56px;height:48px;border-radius:14px;background:var(--lime);color:var(--ink);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;line-height:1.15}
.gob svg{width:1.15rem;height:1.15rem}
.more,.alt{display:block;width:100%;min-height:46px;border-radius:14px;background:var(--s1);border:1px solid var(--line);font-weight:700;margin:4px 0 8px;padding:0 16px}
.empty{text-align:center;color:var(--mut);padding:18px 8px}
.empty .alt{margin-top:12px;color:var(--tx)}

.pin svg{display:block;width:36px;height:46px;overflow:visible;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}

#dots i{width:8px;height:8px;border-radius:4px;background:var(--line)}
#dots i.on{width:22px;background:var(--lime)}
.tbtns{display:flex;gap:8px}
.tbtns .btn{height:46px;padding:0 18px}
.btn.pri{background:var(--lime);color:var(--ink)}

/* ---------- desktop: left panel ---------- */
@media(min-width:900px){
 #sheet{top:0;right:auto;width:380px;border-radius:0;border-top:0;border-left:0;box-shadow:6px 0 22px rgba(0,0,0,.35);padding-bottom:0;transform:none!important;transition:none;will-change:auto;max-height:none}
 .grab{display:none}.brand{display:block}
 #stop{padding-top:10px}
 #top{left:396px;right:auto;width:min(500px,calc(100vw - 440px));padding-top:46px}

 #sheet[data-s=full] #fab{opacity:1;pointer-events:auto}
 .leaflet-bottom.leaflet-left{left:380px;bottom:0}
}

const TL=L.tileLayer(TILES[S.dark?"dark":"light"],{subdomains:"abcd",maxZoom:19,updateWhenIdle:true,keepBuffer:1,attribution:ATTR}).addTo(map);
L.control.attribution({position:"bottomleft",prefix:false}).addTo(map);
if(matchMedia("(pointer:fine)").matches)L.control.zoom({position:"topright"}).addTo(map);
const layer=L.layerGroup().addTo(map);
let meMk=null,selMk=null;

const pinHTML=(c,cls)=>`<div class="pin${cls||""}" style="--c:${c}"><svg viewBox="0 0 36 46"><path d="M18 2C9.2 2 2 9 2 17.6 2 29 18 44 18 44s16-15 16-26.4C34 9 26.8 2 18 2z"/><g class="w"><use href="#i-wifi" x="9" y="9" width="18" height="18"/></g></svg></div>`;
const ICONS={};
function pinIcon(g){return ICONS[g]||(ICONS[g]=L.divIcon({className:"",html:pinHTML(GR[g][3]),iconSize:[36,46],iconAnchor:[18,44]}))}
function selIcon(g){return L.divIcon({className:"",html:pinHTML(GR[g][3]," s"),iconSize:[48,61],iconAnchor:[24,58]})}
const ICON_ME=L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[20,20]});
const ICON_CTR=L.divIcon({className:"",html:'<div class="ctr"></div>',iconSize:[16,16]});

function drawMarkers(){
 layer.clearLayers();
 const l=S.list;if(!l.length)return;
 const b=map.getBounds().pad(.25),s=b.getSouth(),n=b.getNorth(),w=b.getWest(),e=b.getEast(),z=map.getZoom(),inv=[];
 for(const v of l)if(v.dlat>=s&&v.dlat<=n&&v.dlng>=w&&v.dlng<=e)inv.push(v);
 const pin=v=>L.marker([v.dlat,v.dlng],{icon:pinIcon(v.g),keyboard:false}).on("click",()=>select(v)).addTo(layer);
 if(z>=16||inv.length<=25){inv.slice(0,150).forEach(pin);return}
 const g={};
 for(const v of inv){const p=map.project([v.dlat,v.dlng],z),k=((p.x/64)|0)+":"+((p.y/64)|0);(g[k]||(g[k]=[])).push(v)}
 for(const k in g){const a=g[k];
  if(a.length===1){pin(a[0]);continue}
  let la=0,ln=0;for(const v of a){la+=v.dlat;ln+=v.dlng}
  const sz=a.length<10?42:a.length<50?48:56;
  L.marker([la/a.length,ln/a.length],{icon:L.divIcon({className:"",html:`<div class="cl" style="--s:${sz}px">${num(a.length)}</div>`,iconSize:[sz,sz]}),keyboard:false})
   .on("click",()=>map.fitBounds(a.map(v=>[v.dlat,v.dlng]),{...pads(),maxZoom:18})).addTo(layer)}
}
let raf=0;map.on("moveend",()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(drawMarkers)});
map.on("click",()=>{closeMenu();deselect()});

function pads(){const tb=$("top").getBoundingClientRect().bottom+8;return desk?{paddingTopLeft:[400,tb],paddingBottomRight:[40,30]}:{paddingTopLeft:[30,tb],paddingBottomRight:[30,S.vis+20]}}
function fit(){
 const src=S.ref?S.list.slice(0,60):S.list,p=src.map(v=>[v.dlat,v.dlng]);if(S.ref)p.push([S.ref.lat,S.ref.lng]);if(!p.length)return;
 map.fitBounds(p,{...pads(),maxZoom:16})}
function centerOn(v){
 const z=Math.max(map.getZoom(),16),p=map.project([v.dlat,v.dlng],z);
 if(desk)p.x+=VW/2-(380+VW)/2;else{const top=$("top").getBoundingClientRect().bottom;p.y+=VH/2-(top+VH-S.vis)/2}
 map.setView(map.unproject(p,z),z)}

/* ================= bottom sheet ================= */
const sheet=$("sheet");
function safeB(){return parseFloat(getComputedStyle(sheet).paddingBottom)||0}
function setState(s){
 S.ss=s;sheet.dataset.s=s;
 if(desk){S.vis=0;doc.style.setProperty("--vis","0px");return}
 H=Math.min(Math.round(VH*.9),VH-70);sheet.style.height=H+"px";
 sheet.classList.toggle("pm",s==="place");
 const g=$("grab").offsetHeight,sf=safeB();let vis;
 if(s==="peek")vis=g+$("stop").offsetHeight+sf;
 else if(s==="place")vis=g+$("place").offsetHeight+sf;
 else if(s==="half")vis=Math.min(H,Math.round(VH*.55));
 else vis=H;
 S.vis=vis;Y=H-vis;sheet.style.transform=`translate3d(0,${Y}px,0)`;
 doc.style.setProperty("--vis",Math.min(vis,Math.round(VH*.5))+"px")}
/* drag to move the sheet */
let dg=null;
const dz=$("dz");
dz.addEventListener("pointerdown",e=>{
 if(desk||S.ss==="place"||e.target.closest("#cta"))return;
 const pk=$("grab").offsetHeight+$("stop").offsetHeight+safeB();
 dg={tg:e.target,y:e.clientY,Y0:Y,pk,max:H-pk,t:performance.now(),ly:e.clientY,lt:performance.now(),v:0,mv:0};
 try{dz.setPointerCapture(e.pointerId)}catch(_){}
});
dz.addEventListener("pointermove",e=>{
 if(!dg)return;const dy=e.clientY-dg.y;dg.mv=Math.max(dg.mv,Math.abs(dy));
 if(dg.mv>6)sheet.classList.add("drag");
 const now=performance.now();if(now>dg.lt)dg.v=(e.clientY-dg.ly)/(now-dg.lt);dg.ly=e.clientY;dg.lt=now;
 if(dg.mv>6)sheet.style.transform=`translate3d(0,${clamp(dg.Y0+dy,0,dg.max)}px,0)`});
function endDrag(e){
 if(!dg)return;const d=dg;dg=null;sheet.classList.remove("drag");
 if(d.mv<=6){if(d.tg.closest&&(d.tg.closest("#grab")||d.tg.closest("#stop")))toggleSheet();return}
 const cur=clamp(d.Y0+(e.clientY-d.y),0,d.max)+d.v*160,
  opts=[["full",0],["half",H-Math.min(H,Math.round(VH*.55))],["peek",d.max]];
 opts.sort((a,b)=>Math.abs(a[1]-cur)-Math.abs(b[1]-cur));setState(opts[0][0])}
dz.addEventListener("pointerup",endDrag);dz.addEventListener("pointercancel",endDrag);
function toggleSheet(){if(desk||S.ss==="place")return;setState(S.ss==="peek"?"half":"peek")}
$("grab").addEventListener("click",e=>{if(e.detail===0)toggleSheet()});

/* ================= selecting a place ================= */
let prevS="peek";
function select(v,pan=true){
 closeMenu();S.sel=v;
 $("pName").textContent=v.name;$("pMeta").textContent=meta(v);
 $("pIc").textContent=tyEmo(v.type);$("pIc").style.setProperty("--c",GR[v.g][3]);
 $("pGo").href=dir(v);
 if(selMk)selMk.remove();
 selMk=L.marker([v.dlat,v.dlng],{icon:selIcon(v.g),zIndexOffset:1000,keyboard:false}).addTo(map);
 sheet.classList.add("hasSel");
 if(!desk){if(S.ss!=="place")prevS=S.ss;setState("place")}
 if(pan)centerOn(v)}
function deselect(){
 if(!S.sel)return;S.sel=null;if(selMk){selMk.remove();selMk=null}
 sheet.classList.remove("hasSel");
 if(!desk)setState(prevS==="place"?"peek":prevS)}
$("pClose").onclick=deselect;
if(navigator.share){$("pShare").hidden=false;$("pShare").onclick=()=>{const v=S.sel;if(v)navigator.share({title:v.name,text:v.name+" – Free Y-Fi WiFi",url:`https://www.google.com/maps/search/?api=1&query=${v.lat},${v.lng}`}).catch(()=>{})}}

/* ================= data -> lists ================= */
function compute(){
 const q=S.q.trim().toLowerCase();S.far=false;
 let l=S.v.filter(v=>(!S.grp||v.g===S.grp)&&(!q||v.hay.includes(q)));
 if(S.ref){for(const v of l)v.d=kmd(S.ref.lat,S.ref.lng,v.lat,v.lng);l.sort((a,b)=>a.d-b.d);
  if(S.r){const w=l.filter(v=>v.d<=S.r);if(w.length)l=w;else if(l.length){S.far=true;l=l.slice(0,5)}}}
 else{for(const v of l)v.d=null;l.sort((a,b)=>a.k<b.k?-1:a.k>b.k?1:0)}
 S.list=l}
function renderStatus(){
 let txt,cta="";
 if(S.load&&!S.v.length)txt=T.load;
 else if(S.err&&!S.v.length){txt=T.fail;cta="retry"}
 else{
  if(S.msg)txt=S.msg;else if(S.far)txt=T.far;
  else txt=T.count(S.list.length)+(S.ref&&S.r?" · "+T.within(S.r):"");
  if(!S.ref&&!S.busy)cta="near"}
 $("title").textContent=txt;
 const c=$("cta");c.hidden=!cta;c.dataset.k=cta;
 c.innerHTML=cta==="near"?`<svg class="i"><use href="#i-loc"/></svg>${esc(T.nearBtn)}`:cta==="retry"?esc(T.retry):""}
function renderRad(){
 const r=$("rad");r.hidden=!S.ref;if(!S.ref)return;
 r.innerHTML=[1,2,5,0].map(x=>`<button class="seg${S.r===x?" on":""}" data-r="${x}">${x?num(x)+" "+T.km:T.all}</button>`).join("")}
const cardHTML=(v,i)=>`<div class="card" data-i="${i}" tabindex="0"><i class="ci" style="--c:${GR[v.g][3]}">${tyEmo(v.type)}</i><div class="info"><b>${esc(v.name)}</b><span>${esc(meta(v))}</span></div><a class="gob" target="_blank" rel="noopener" href="${esc(dir(v))}" aria-label="${esc(T.go)}"><svg class="i f"><use href="#i-nav"/></svg>${esc(T.goS)}</a></div>`;
const moreHTML=n=>`<button class="more" id="more">${esc(T.more)} (${num(n)})</button>`;
function renderList(){
 const el=$("list"),l=S.list;
 if(S.load&&!S.v.length){el.innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>';return}
 if(S.err&&!S.v.length){el.innerHTML="";return}
 if(!l.length){el.innerHTML=`<div class="empty">${esc(T.none)}${S.q.trim()?`<button class="alt" id="areaBtn">${esc(T.area)}</button>`:""}${S.grp?`<button class="alt" id="anyBtn">${esc(T.anyType)}</button>`:""}</div>`;return}
 el.innerHTML=l.slice(0,S.n).map(cardHTML).join("")+(l.length>S.n?moreHTML(l.length-S.n):"");
 $("body").scrollTop=0}
function moreList(){
 const el=$("list"),l=S.list,a=S.n;S.n+=20;const m=$("more");if(m)m.remove();
 el.insertAdjacentHTML("beforeend",l.slice(a,S.n).map((v,k)=>cardHTML(v,a+k)).join("")+(l.length>S.n?moreHTML(l.length-S.n):""))}
function update(o={}){
 compute();renderStatus();renderRad();renderList();drawMarkers();
 if(!desk&&S.ss==="peek")setState("peek");
 if(S.sel)$("pMeta").textContent=meta(S.sel);
 if(o.fit)fit()}
$("list").onclick=e=>{
 if(e.target.closest("a"))return;
 if(e.target.closest("#more"))return moreList();
 if(e.target.closest("#areaBtn"))return geocode();
 if(e.target.closest("#anyBtn"))return setGrp("");
 const c=e.target.closest(".card");if(c)select(S.list[+c.dataset.i])};
$("list").onkeydown=e=>{if(e.key==="Enter"){const c=e.target.closest(".card");if(c&&e.target===c)select(S.list[+c.dataset.i])}};
$("rad").onclick=e=>{const b=e.target.closest("[data-r]");if(!b)return;S.r=+b.dataset.r;S.msg="";S.n=20;update({fit:true})};

/* chips */
function renderChips(){
 const have=new Set(S.v.map(v=>v.g)),order=["food","shop","health","study","move","fun","other"].filter(g=>have.has(g));
 $("chips").innerHTML=`<button class="chip" data-g="">${esc(T.all)}</button>`+order.map(g=>`<button class="chip" data-g="${g}">${GR[g][0]} ${esc(lb(GR[g]))}</button>`).join("");
 markChips()}
function markChips(){for(const c of $("chips").children)c.classList.toggle("on",c.dataset.g===S.grp)}
function setGrp(g){S.grp=S.grp===g?"":g;S.msg="";S.n=20;deselect();markChips();update({fit:true})}
$("chips").onclick=e=>{const b=e.target.closest("[data-g]");if(b)setGrp(b.dataset.g)};

/* ================= search ================= */
let qt=0;
$("q").addEventListener("input",e=>{
 S.q=e.target.value;$("qx").hidden=!S.q;clearTimeout(qt);
 qt=setTimeout(()=>{S.msg="";S.n=20;deselect();update({fit:true})},220)});
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){clearTimeout(qt);e.target.blur();S.msg="";S.n=20;update({fit:true});if(!S.list.length)geocode();else if(!desk)setState("half")}});
$("qx").onclick=()=>{S.q="";$("q").value="";$("qx").hidden=true;S.msg="";update({fit:true})};
async function geocode(){
 const q=S.q.trim();if(!q)return;S.msg=T.locating;update();
 try{
  const c=new AbortController(),tm=setTimeout(()=>c.abort(),10000);
  const r=await(await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=bd&q="+encodeURIComponent(q+", Dhaka"),{signal:c.signal})).json();clearTimeout(tm);
  if(!r.length){S.msg=T.nf;return update()}
  S.q="";$("q").value="";$("qx").hidden=true;S.n=20;S.msg="";if(!S.r)S.r=2;
  setRef(+r[0].lat,+r[0].lon,false);update({fit:true});if(!desk)setState("half")
 }catch(e){S.msg=T.nf;update()}}

/* ================= location ================= */
function setRef(lat,lng,user){
 S.ref={lat,lng,user};if(meMk)meMk.remove();
 meMk=L.marker([lat,lng],{icon:user?ICON_ME:ICON_CTR,interactive:false,keyboard:false,zIndexOffset:500}).addTo(map);
 $("fab").classList.toggle("on",user)}
function locate(){
 if(!navigator.geolocation){S.msg=T.deny;return update()}
 S.msg=T.locating;S.busy=true;$("fab").classList.add("busy");update();
 const done=()=>{S.busy=false;$("fab").classList.remove("busy")};
 const ok=p=>{done();S.msg="";S.n=20;deselect();setRef(p.coords.latitude,p.coords.longitude,true);update({fit:true})};
 const fail=(e,final)=>{if(e&&e.code===1){done();S.msg=T.deny;return update()}
  if(!final)return navigator.geolocation.getCurrentPosition(ok,x=>fail(x,true),{enableHighAccuracy:false,timeout:9000,maximumAge:300000});
  done();S.msg=T.nogeo;update()};
 navigator.geolocation.getCurrentPosition(ok,e=>fail(e,false),{enableHighAccuracy:true,timeout:9000,maximumAge:60000})}
$("fab").onclick=locate;
$("cta").onclick=()=>{$("cta").dataset.k==="retry"?load():locate()};

 $("qTheme").title=S.lang==="bn"?"ডার্ক/লাইট মোড":"Dark/light mode";

}

function placeTip(){
 const s=STEPS[ti],sp=$("spot"),tip=$("tip");let r=null;
 if(s.pins){const top=$("top").getBoundingClientRect().bottom,x0=desk?380:0,cy=(top+VH-S.vis)/2,cx=(x0+VW)/2,d=Math.min(210,(VH-S.vis-top)*.8);r={left:cx-d/2,top:cy-d/2,width:d,height:d,rad:d/2}}
 else if(s.el){const b=document.querySelector(s.el).getBoundingClientRect(),p=6,bt=Math.max(0,b.top-p),bb=Math.min(VH,b.bottom+p);r={left:Math.max(0,b.left-p),top:bt,width:Math.min(VW,b.right+p)-Math.max(0,b.left-p),height:bb-bt,rad:s.rad}}
 if(r){sp.className="ring";sp.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;border-radius:${r.rad}px`}
 else{sp.className="";sp.style.cssText="left:50%;top:50%;width:0;height:0"}
 const tw=tip.offsetWidth,th=tip.offsetHeight,m=12;let top,left;
 if(!r){top=(VH-th)/2;left=(VW-tw)/2}
 else{const below=VH-(r.top+r.height)-14,above=r.top-14;let useBelow=r.top+r.height/2<VH/2;
  if(useBelow&&below<th&&above>below)useBelow=false;else if(!useBelow&&above<th&&below>above)useBelow=true;
  top=useBelow?r.top+r.height+14:r.top-th-14;left=clamp(r.left+r.width/2-tw/2,m,VW-tw-m)}
 top=clamp(top,m,Math.max(m,VH-th-m));
 if(r&&s.el&&top+th+8>r.top&&top<r.top+r.height&&top<r.top){const nt=top+th+8;if(nt<r.top+r.height-60){r.height-=nt-r.top;r.top=nt;sp.style.top=r.top+"px";sp.style.height=r.height+"px"}}
 tip.style.top=top+"px";tip.style.left=left+"px"}

/* ================= load venues (cached first, then fresh) ================= */
async function J(u){const c=new AbortController(),m=setTimeout(()=>c.abort(),12000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(m)}}
function rowsFrom(data){
 // Support common API envelopes, legacy records and GeoJSON feature collections.
 let a=[];
 if(Array.isArray(data))a=data;
 else if(data&&typeof data==="object"){
  for(const k of ["results","data","devices","venues","locations","items","features"]){if(Array.isArray(data[k])){a=data[k];break}}
 }
 const out=[];
 for(const item of a){
  if(!item||typeof item!=="object")continue;
  const props=item.properties&&typeof item.properties==="object"?{...item.properties,...item}:item;
  const name=props.name||props.title||props.device_name||props.location_name||props.label||"—";
  const type=String(props.type||props.category||props.device_type||props.place_type||"Other").trim()||"Other";
  let lat,lng,pair=props.coords||props.coordinates||props.coordinate;
  if(item.geometry&&Array.isArray(item.geometry.coordinates))pair=item.geometry.coordinates;
  if(Array.isArray(pair)&&pair.length>=2){
   const x=Number(pair[0]),y=Number(pair[1]);
   // GeoJSON uses [longitude, latitude]; Dhaka coordinates are roughly 20–27 N, 88–93 E.
   if(Math.abs(x)>60&&Math.abs(x)<=180&&Math.abs(y)<=90){lng=x;lat=y}else{lat=x;lng=y}
  }else{
   lat=Number(props.lat??props.latitude??props.device_latitude);
   lng=Number(props.lng??props.lon??props.longitude??props.long??props.device_longitude);
  }
  if(!Number.isFinite(lat)||!Number.isFinite(lng)||lat===0||lng===0||Math.abs(lat)>90||Math.abs(lng)>180)continue;
  if(Math.abs(lat)>60&&Math.abs(lng)<=90){const t=lat;lat=lng;lng=t}
  out.push([String(name),type,lat,lng]);
 }
 return out;
}
function build(rows){
 const seen={};
 S.v=rows.map(([name,type,lat,lng])=>{
  const k=lat.toFixed(5)+","+lng.toFixed(5),n=seen[k]=(seen[k]||0)+1,a=n*2.4,o=n>1?0.00018*Math.ceil(n/6):0,g=(TY[type]||[])[3]||"other",ty=TY[type]||["","","",""];
  return{name,type,g,lat,lng,dlat:lat+o*Math.cos(a),dlng:lng+o*Math.sin(a),k:name.toLowerCase(),hay:(name+" "+type+" "+ty[1]+" "+ty[2]+" "+GR[g][1]+" "+GR[g][2]).toLowerCase()}})}
async function load(){
 S.err=false;S.load=true;renderStatus();renderList();
 let had=S.v.length>0;
 if(!had){const c=st.get("v3");if(c){try{build(JSON.parse(c));had=S.v.length>0;if(had){S.load=false;renderChips();update({fit:true})}}catch(e){}}}
 let rows=[];
 // Prefer same-origin proxy (local Python server or a deployed /api/venues proxy), then try direct API.
 for(const endpoint of [API_FALLBACK,API]){
  try{const data=await J(endpoint);rows=rowsFrom(data);if(!rows.length)throw new Error("No supported venue records in API response");break}
  catch(e){/* try the next endpoint */}
 }
 if(rows.length){build(rows);st.set("v3",JSON.stringify(rows));S.load=false;S.err=false;const status=$("apiStatus");if(status)status.textContent="";renderChips();update({fit:!had});return}
 S.load=false;
 if(!had){S.err=true;const status=$("apiStatus");if(status)status.textContent="Venue service unavailable. Check the API/server connection, then retry."}
 update();
}

 VH=innerHeight;VW=innerWidth;const d=innerWidth>=900;

let rt=0;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(onResize,120)});
prefs();renderChips();

load();

if(!seen)setTimeout(startTour,500);
else if(navigator.permissions&&navigator.permissions.query)navigator.permissions.query({name:"geolocation"}).then(p=>{if(p.state==="granted")locate()}).catch(()=>{});
})();
